data:
  path: LSWMD.pkl
  cache: artifacts/experiment_data.npz
  map_size: 64

split:
  seed: 0
  val_frac: 0.1
  test_frac: 0.2

artifacts_dir: artifacts

budgets: [0.01, 0.05, 0.10, 0.25, 1.0]
seeds: [0, 1, 2]

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_root: mlartifacts
  experiment_name: wm811k
  model_name: wafer-classifier

train:
  steps: 4000
  eval_every: 250
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 0

gbm:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.1

simclr:
  steps: 20000
  batch_size: 512
  lr: 0.001
  temperature: 0.2
  checkpoint: artifacts/simclr_encoder.pt

fixmatch:
  threshold: 0.95
  mu: 2
  lambda_u: 1.0

export_dir: models/best_model

gate:
  min_macro_f1: 0.3  # provisional: set to just under the best full-label result after the sweep
  metadata_file: models/best_model/metadata.json

drift:
  reference_size: 5000
  url: http://localhost:8080
  shift_rate: 0.3
  normal_samples: 500
  shifted_samples: 1500
