name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: poetry run ruff check .
      - name: Test
        run: poetry run pytest
      # Re-scores the committed weights on the committed held-out sample and fails the build when
      # macro-F1 is below gate.min_macro_f1.
      # Skipped until a model has been exported and committed (see README).
      - name: Model quality gate
        if: ${{ hashFiles('models/best_model/weights.pt') != '' && hashFiles('models/best_model/eval_sample.npz') != '' }}
        run: poetry run python -m wm811k.cli gate

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        if: ${{ hashFiles('models/best_model/weights.pt') != '' }}
        run: docker build -t wm811k:ci .
      - name: Smoke test the container
        if: ${{ hashFiles('models/best_model/weights.pt') != '' }}
        run: |
          docker run -d --name wm811k -p 8080:8080 wm811k:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
          curl -sf http://localhost:8080/health
          curl -sf -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"wafer_map": [[0,1,1,0],[1,2,1,1],[1,1,2,1],[0,1,1,0]]}'
          docker logs wm811k
