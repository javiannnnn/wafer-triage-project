[project]
name = "wm811k"
version = "0.1.0"
description = "Supervised vs semi-supervised wafer defect classification on WM-811K, with an MLOps layer"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3,<2",
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "scikit-learn (>=1.5,<2)",
]

[tool.poetry]
packages = [{ include = "wm811k", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
